# Alembic configuration for School Catering Application
# Użyj: alembic upgrade head (migracja) / alembic downgrade -1 (cofnięcie)

[alembic]
script_location = venv/migrations
prepend_sys_path = .
sqlalchemy.url = sqlite+aiosqlite:///venv/database/database.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
