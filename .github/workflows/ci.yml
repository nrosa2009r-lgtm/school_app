# ============================================================
#  School Catering Application - CI/CD Pipeline
#  Wersja: 2.0 Enterprise
# ============================================================

name: School Catering CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Uruchom testy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v4

      - name: Instalacja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalacja zależności
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Uruchom testy
        run: |
          PYTHONPATH=. pytest -v tests/test_school_app.py --tb=short

  lint:
    name: Analiza kodu (Bandit)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v4

      - name: Instalacja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalacja Bandit
        run: pip install bandit

      - name: Skan bezpieczeństwa Bandit
        run: bandit -r venv/ -x venv/Lib,venv/Scripts,venv/Include,venv/share,.test_venv -ll
